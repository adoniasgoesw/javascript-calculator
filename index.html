<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

        <link rel="stylesheet" href="src/styles.css">
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <title>Calculator</title>
</head>

<body>
    <div class="calculator">
        <div class="calculator-header">
            <div class="box-theme">
                <button
                    type="button"
                    id="toggle-theme"
                    aria-label="Alternar tema"
                >
                    <i class="fa-solid fa-sun" aria-hidden="true"></i>
                </button>
            </div>

            <div class="box-display">
                <input
                    type="text"
                    id="history"
                    value=""
                    readonly
                    aria-label="Última operação"
                >

                <input
                    type="text"
                    id="display"
                    value="0"
                    readonly
                    aria-label="Visor da calculadora"
                >
            </div>
        </div>

        <div class="calculator-body">
            <!-- Primeira linha -->
            <button type="button" onclick="clearDisplay()">
                AC
            </button>

            <button
                type="button"
                onclick="insertToDisplay('/')"
                aria-label="Dividir"
            >
                <i class="fa-solid fa-divide" aria-hidden="true"></i>
            </button>

            <button
                type="button"
                onclick="insertToDisplay('*')"
                aria-label="Multiplicar"
            >
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>

            <button
                type="button"
                onclick="deleteDisplay()"
                aria-label="Apagar último caractere"
            >
                <i class="fa-solid fa-delete-left" aria-hidden="true"></i>
            </button>

            <!-- Segunda linha -->
            <button type="button" onclick="insertToDisplay('7')">7</button>
            <button type="button" onclick="insertToDisplay('8')">8</button>
            <button type="button" onclick="insertToDisplay('9')">9</button>

            <button
                type="button"
                onclick="insertToDisplay('-')"
                aria-label="Subtrair"
            >
                <i class="fa-solid fa-minus" aria-hidden="true"></i>
            </button>

            <!-- Terceira linha -->
            <button type="button" onclick="insertToDisplay('4')">4</button>
            <button type="button" onclick="insertToDisplay('5')">5</button>
            <button type="button" onclick="insertToDisplay('6')">6</button>

            <button
                type="button"
                onclick="insertToDisplay('+')"
                aria-label="Somar"
            >
                <i class="fa-solid fa-plus" aria-hidden="true"></i>
            </button>

            <!-- Quarta linha -->
            <button type="button" onclick="insertToDisplay('1')">1</button>
            <button type="button" onclick="insertToDisplay('2')">2</button>
            <button type="button" onclick="insertToDisplay('3')">3</button>

            <!-- Quarta e quinta linhas -->
            <button
                type="button"
                id="btn-equals"
                onclick="result()"
                aria-label="Calcular resultado"
            >
                <i class="fa-solid fa-equals" aria-hidden="true"></i>
            </button>

            <!-- Quinta linha -->
            <button
                type="button"
                class="btn-zero"
                onclick="insertToDisplay('0')"
            >
                0
            </button>

            <button
                type="button"
                onclick="insertToDisplay('.')"
                aria-label="Ponto decimal"
            >
                <i
                    class="fa-solid fa-circle"
                    id="circle"
                    aria-hidden="true"
                ></i>
            </button>
        </div>
    </div>

    
</body>
<script src="scripts/scritp.js"></script>
</html>
